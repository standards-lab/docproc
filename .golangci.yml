# golangci-lint v2 configuration, run per module by `mise run check`.
version: "2"

# The integration tier's files, under the integration build tag, are linted with the unit tier's:
# a file of either tier builds under the tag, so one run covers both.
run:
  build-tags:
    - integration

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused),
  # plus depguard, which holds the module to its allowed imports, and
  # testpackage, which keeps tests black-box. Its skip regexp is
  # narrowed to export_test.go: tests live in <pkg>_test and drive the
  # exported API, and the one white-box file allowed is export_test.go.
  # allow-packages is narrowed from its default, main, so a command's tests
  # are black-box too, in main_test. It names only the empty package name,
  # which no package has: an empty list leaves the default, main, in force.
  default: standard
  enable:
    - depguard
    - testpackage
  settings:
    testpackage:
      skip-regexp: export_test\.go
      allow-packages: [""]
    depguard:
      rules:
        # The module depends on nothing but the standard library (unsafe
        # among it, which waitid in tool/exec.go uses) and golang.org/x/text's
        # packages, which the text stage decodes through (stages/text.go),
        # so no package imports a model client. The rule covers
        # every Go file, tests included: they drive the API with the same
        # imports plus the module itself. Allow entries match by prefix
        # unless they end in `$`, so the module's entries are anchored: the
        # module as itself or a package under it (not a sibling like
        # docproc-extra). The longest match wins, so the deny entries keep
        # the storage, postgres, and cmd/docproc modules, which require the
        # base, out of it despite its prefix; each carries its own
        # .golangci.yml, which golangci-lint takes as the nearest to the
        # directory it runs in.
        module:
          list-mode: strict
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/standards-lab/docproc$
            - github.com/standards-lab/docproc/
            - golang.org/x/text/
          deny:
            - pkg: github.com/standards-lab/docproc/storage
              desc: the base imports no provider; the storage module depends on the base
            - pkg: github.com/standards-lab/docproc/postgres
              desc: the base imports no provider; the postgres module depends on the base
            - pkg: github.com/standards-lab/docproc/cmd/docproc
              desc: the base imports no command package; the cmd/docproc module depends on the base
