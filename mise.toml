[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
shellcheck = "0.11.0"

# Space-separated list of Go module directories. Empty until the library task lands the base
# module.
[env]
GO_MODULES = ""
# Space-separated list of the system tools under tools/, each with its own mise.toml that pins its
# toolchain and defines its `check` and `currency` tasks, which the root's tasks run in turn.
TOOLS = "ooxml"

# The one check: read-only and deterministic, stopping at the first failure.
[tasks.check]
description = "Lint the scripts and workflows; build, vet, format, fix, tidy, test, and lint every module; then run each tool's check and write its third-party notices to nowhere; writes nothing outside the tools' build output"
run = '''
set -eu
mise -C "$MISE_PROJECT_ROOT" run lint
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "check: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
for tool in $TOOLS; do
  echo "check: tools/$tool"
  mise -C "$MISE_PROJECT_ROOT/tools/$tool" run check
  # The notices a release would pack for this machine, so a package the script can't give a notice
  # for fails here, not at the tag.
  "$MISE_PROJECT_ROOT/tools/notices.sh" "$tool" "$rid" >/dev/null
done
echo "check: ok"
'''

# actionlint shellchecks each workflow's run: blocks too, with the shellcheck pinned above. CI's
# lint job runs this task; the check runs it first.
[tasks.lint]
description = "Shellcheck every committed shell script and lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
dir = "{{config_root}}"
run = '''
set -eu
git ls-files -z '*.sh' | xargs -0 -r shellcheck
actionlint
'''

# Read-only and development-time: it reads the network, so CI never runs it.
[tasks.currency]
description = "Report every requirement, tool, and action pin behind its latest, and each tool's own currency; writes nothing outside the tools' obj/"
run = "scripts/currency.sh"
