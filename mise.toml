# docproc's root toolchain, the live tiers' environment, and the repository's tasks.
# See docs/development.md
# See architecture/standards/go-elemental/principles/release-and-ci.md
[settings]
task.run_auto_install = false

[tools]
"aqua:google/go-containerregistry" = "0.22.1"
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
"github:ip7z/7zip" = "26.06"
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[env]
GO_MODULES = ". storage postgres cmd/docproc"
DOCPROC_DSN = "postgres://app:app@127.0.0.1:{{ get_env(name='DOCPROC_POSTGRES_PORT', default='5436') }}/app?sslmode=disable"
DOCPROC_S3_ENDPOINT = "http://127.0.0.1:{{ get_env(name='DOCPROC_SEAWEEDFS_PORT', default='8334') }}"
DOCPROC_S3_ACCESS_KEY = "admin"
DOCPROC_S3_SECRET_KEY = "secret"
TOOLS = "ooxml mail onenote"
HOLDS = '''
'''

[tasks.check]
description = "Lint the scripts and workflows, test the tag routing, and run lint-context and lint-references; check every Go module; then run each tool's check and write its third-party notices to nowhere; writes nothing outside the tools' build output"
run = '''
set -eu
mise -C "$MISE_PROJECT_ROOT" run lint
mise -C "$MISE_PROJECT_ROOT" run check:go
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "check: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
for tool in $TOOLS; do
  echo "check: tools/$tool"
  mise -C "$MISE_PROJECT_ROOT/tools/$tool" run check
  "$MISE_PROJECT_ROOT/tools/notices.sh" "$tool" "$rid" >/dev/null
done
echo "check: ok"
'''

[tasks."check:go"]
description = "Build, vet, format, fix, tidy, test, and lint every Go module, then sqlint the postgres module's SQL; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT/postgres"
go tool sqlint .
'''

[tasks.lint]
description = "Shellcheck every committed shell script, lint the GitHub Actions workflows with actionlint, test the release workflow's tag routing, then run lint-context and lint-references, running every one before failing if any failed; reads no network, writes only a temporary tree"
dir = "{{config_root}}"
run = '''
set -u
fail=0
run_lint() {
  if ! command -v "$1" >/dev/null; then
    echo "FAIL: $1 is not on PATH; run mise install" >&2
    fail=1
  elif ! "$@"; then
    fail=1
  fi
}
run_lint shellcheck $(git ls-files '*.sh')
run_lint actionlint
scripts/release-tag-test.sh || fail=1
run_lint lint-context
run_lint lint-references
exit "$fail"
'''

[tasks."test:integration"]
description = "Build the three docproc tools from this checkout, put them first on PATH, and run every Go module's integration tier, cmd/docproc's over the built docproc, the provider modules' against the compose harness; writes only the tools' build output and temporary directories"
run = '''
set -eu
export GOWORK=off
bin=$(mktemp -d)
trap 'rm -rf "$bin"' EXIT
for tool in $TOOLS; do
  echo "test:integration: building tools/$tool"
  mise -C "$MISE_PROJECT_ROOT/tools/$tool" run publish
  ln -s "$MISE_PROJECT_ROOT/tools/$tool/.state/publish/docproc-$tool" "$bin/docproc-$tool"
done
export PATH="$bin:$PATH"
for tool in $TOOLS; do
  echo "test:integration: $(command -v "docproc-$tool"): $("docproc-$tool" --version | head -n 1)"
done
echo "test:integration: $(command -v 7zz)"
rc=0
echo "test:integration: ."
(cd "$MISE_PROJECT_ROOT" && go test -tags integration ./...) || rc=1
echo "test:integration: cmd/docproc"
(cd "$MISE_PROJECT_ROOT/cmd/docproc" && go test -tags integration -count=1 ./integration/) || rc=1
mise -C "$MISE_PROJECT_ROOT" run integration || rc=1
exit $rc
'''

[tasks."integration:postgres"]
description = "Run the postgres module's integration suite against a fresh compose PostgreSQL"
dir = "{{config_root}}"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs postgres; docker compose down postgres; exit $rc' EXIT
docker compose up -d --wait --build postgres
(cd postgres && go test -race -tags integration -count=1 -v ./...)
'''

[tasks."integration:storage"]
description = "Run the storage module's integration suite against a fresh compose SeaweedFS"
dir = "{{config_root}}"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs seaweedfs; docker compose down seaweedfs; exit $rc' EXIT
docker compose up -d --wait --build seaweedfs
(cd storage && go test -race -tags integration -count=1 -v ./...)
'''

[tasks.integration]
description = "Run the postgres and storage modules' integration suites, each against a fresh compose service"
run = '''
rc=0
mise -C "$MISE_PROJECT_ROOT" run integration:postgres || rc=1
mise -C "$MISE_PROJECT_ROOT" run integration:storage || rc=1
exit $rc
'''

[tasks.currency]
description = "Report every requirement, tool, action pin, and compose image pin behind its latest, and each tool's own currency; writes nothing outside the tools' obj/"
run = "scripts/currency.sh report"

[tasks.upgrade]
description = "Bump the root mise pins, each Go module's go directive, direct requirements, and tool modules, each workflow action pin, and each compose image pin to their latest, but a held one, then run each tool's upgrade; rewrites mise.toml, go.mod, go.sum, the workflows, the compose Dockerfiles, and the tools' pins and lock files"
run = "scripts/currency.sh upgrade"
