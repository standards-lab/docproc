[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"

# Space-separated list of Go module directories. Empty until the library task lands the base
# module.
[env]
GO_MODULES = ""
# Space-separated list of the system tools under tools/, each with its own mise.toml that pins its
# toolchain and defines its `check` and `currency` tasks, which the root's tasks run in turn.
TOOLS = "ooxml"

# The one check: read-only and deterministic, stopping at the first failure.
[tasks.check]
description = "Build, vet, format, tidy, test, and lint every module, then run each tool's check; writes nothing outside the tools' build output"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
for tool in $TOOLS; do
  echo "check: tools/$tool"
  mise -C "$MISE_PROJECT_ROOT/tools/$tool" run check
done
echo "check: ok"
'''

# Read-only and development-time: it reads the network, so CI never runs it.
[tasks.currency]
description = "Report every requirement, tool, and action pin behind its latest, and each tool's own currency; writes nothing outside the tools' obj/"
run = "scripts/currency.sh"
