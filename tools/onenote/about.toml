# cargo-about's configuration, read by tools/notices.sh for docproc-onenote's third-party notices.
# See docs/tool-builds.md
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

[onenote_parser]
accepted = ["MPL-2.0"]

[onenote_parser-macros]
accepted = ["MPL-2.0"]

[foldhash]
accepted = ["Zlib"]
