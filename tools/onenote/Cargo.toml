# See docs/tool-builds.md
[package]
name = "docproc-onenote"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "docproc's OneNote tool: OneNote sections, packages, and notebooks to a JSON model"
publish = false

[dependencies]
docproc-envelope = { path = "../envelope" }
# Pinned exactly: the CLI works around this release's exact text and logic, so a new release
# is a reviewed change (docs/tool-builds.md).
onenote_parser = { version = "=2.1.0", features = ["onepkg"] }
typed-path = "0.12.4"
time = "0.3.55"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"
cab = "0.6.0"

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
roxmltree = "0.21.2"

[profile.release]
overflow-checks = true

[lints.clippy]
allow_attributes_without_reason = "deny"
