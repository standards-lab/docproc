# docproc-onenote's toolchain and its check, publish, golden, currency, and upgrade tasks.
# See docs/tool-builds.md
[tools]
cargo-deny = "0.22.1"
"github:EmbarkStudios/cargo-about" = "0.9.3"
jq = "1.8.2"
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" }
shellcheck = "0.11.0"

[env]
HOLDS = '''
typed-path 0.12.4: onenote_parser 2.1.0 requires ^0.12.3; it moves only with onenote_parser
'''

[tasks.check]
description = "Format-check, lint, and test docproc-onenote and the shared envelope crate against the static musl release binary, lint the envelope on its own locked graph, then print the binary's version; writes only target/ and tools/envelope/target/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$CARGO_HOME/bin:$PATH"
target="$(uname -m)-unknown-linux-musl"
cargo fmt --check
cargo fmt --check --manifest-path ../envelope/Cargo.toml
cargo clippy --all-targets --locked --target "$target" -p docproc-onenote -p docproc-envelope -- -D warnings
cargo clippy --all-targets --locked --target "$target" --manifest-path ../envelope/Cargo.toml -- -D warnings
cargo test --release --locked --target "$target" -p docproc-onenote -p docproc-envelope
"target/$target/release/docproc-onenote" --version
'''

[tasks.publish]
description = "Build the static musl release binary for this machine from the locked crate graph; writes only target/ and .state/publish/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$CARGO_HOME/bin:$PATH"
target="$(uname -m)-unknown-linux-musl"
cargo build --release --locked --target "$target"
rm -rf .state/publish
mkdir -p .state/publish
cp "target/$target/release/docproc-onenote" .state/publish/
'''

[tasks.golden]
description = "Re-record the .jsonl and .stderr goldens from the static musl release binary, through the tests' UPDATE_GOLDEN; the check never runs it; writes only target/ and the goldens"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$CARGO_HOME/bin:$PATH"
target="$(uname -m)-unknown-linux-musl"
UPDATE_GOLDEN=1 cargo test --release --locked --target "$target" -p docproc-onenote
'''

[tasks.currency]
description = "Report every crate in Cargo.lock and tools/envelope/Cargo.lock behind its latest, within its requirement or beyond it, every crate with a RustSec advisory, and every mise tool behind its latest, a held one as held; writes only cargo-deny's advisory database"
dir = "{{config_root}}"
run = "../currency.sh onenote report"

[tasks.upgrade]
description = "Bump every mise tool here and every crate to its latest, but a held one, rewriting mise.toml, Cargo.toml, tools/envelope/Cargo.toml, Cargo.lock, and tools/envelope/Cargo.lock"
dir = "{{config_root}}"
run = "../currency.sh onenote upgrade"
