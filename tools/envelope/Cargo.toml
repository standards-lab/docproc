[package]
name = "docproc-envelope"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The common envelope of docproc's Rust system tools: faults and exit codes, stderr lines, the lines writer, the guard, the media store, and the Markdown escapes"
# Untagged and unpublished: each Rust tool under tools/ depends on it by path, and its tests run in
# each tool's check, against that tool's Cargo.lock.
publish = false

[dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
# RustCrypto's SHA-256: a medium is named by the hash of its content.
sha2 = "0.11.1"
