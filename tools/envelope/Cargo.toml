# See docs/tool-builds.md
[package]
name = "docproc-envelope"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The common envelope of docproc's Rust system tools: faults and exit codes, stderr lines, the lines writer, the guard, the media store, the Markdown escapes, the content rule, and the general categories"
publish = false

[dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
# The ICU4X crates, here and below, are required exactly, so every tool's lock resolves to
# ICU4X 2.4.0 on Unicode 18.0.0, a version that is part of schema "2", and a bump that moves
# the Unicode version fails the unit test asserting it, a reviewed change.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_normalizer_data = "=2.4.0"
icu_properties_data = "=2.4.0"
icu_segmenter_data = "=2.4.0"
pulldown-cmark = { version = "=0.13.6", default-features = false, optional = true }

[features]
markdown = ["dep:pulldown-cmark"]

[lints.clippy]
allow_attributes_without_reason = "deny"
