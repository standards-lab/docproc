# docproc-ooxml's toolchain and its check, publish, currency, upgrade, fixtures, and golden tasks.
# See docs/tool-builds.md
[tools]
dotnet = "11.0.100"
jq = "1.8.2"
uv = "0.13.10"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
GLIBC_FLOOR = "2.34"

[tasks.check]
description = "Restore the locked package graph, format, build, publish the CLI with NativeAOT, and test, the CLI tests on the published binary, all warnings as errors; writes only bin/, obj/, and .state/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "check: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet restore DocprocOoxml.slnx --locked-mode
dotnet format DocprocOoxml.slnx --verify-no-changes --no-restore
dotnet build DocprocOoxml.slnx --no-restore -warnaserror
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror -o .state/aot
dotnet test --solution DocprocOoxml.slnx --no-build
.state/aot/docproc-ooxml --version
'''

[tasks.publish]
description = "Publish the release binary for this machine's runtime identifier from the locked package graph, its version the csproj's alone; writes only bin/, obj/, and .state/publish/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "publish: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet restore DocprocOoxml.slnx --locked-mode
rm -rf .state/publish
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror \
  -p:IncludeSourceRevisionInInformationalVersion=false -o .state/publish
'''

[tasks.currency]
description = "Report every NuGet package behind its latest or with a known vulnerability, every fixture generator package and mise tool behind its latest; writes only obj/"
dir = "{{config_root}}"
run = '''
set -euo pipefail
export PATH="$DOTNET_ROOT:$PATH"
stale=0
report() {
  echo "tools/ooxml: $1"
  stale=1
}
dotnet restore DocprocOoxml.slnx --locked-mode >/dev/null

packages=$(dotnet list DocprocOoxml.slnx package --outdated --format json |
  jq -r '.projects[] | .path as $p | .frameworks[]?.topLevelPackages[]? |
    "\($p | split("/") | last): \(.id) \(.requestedVersion) -> \(.latestVersion)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$packages"

vulnerable=$(dotnet list DocprocOoxml.slnx package --vulnerable --include-transitive --format json |
  jq -r '.projects[] | .path as $p | .frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) |
    select(.vulnerabilities) | .id as $id | .resolvedVersion as $v | .vulnerabilities[] |
    "\($p | split("/") | last): \($id) \($v) vulnerable (\(.severity)): \(.advisoryurl)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$vulnerable"

generator=$(uv tree -q --script fixtures/generate.py --outdated --depth 0 --locked | sed -n '/(latest: /p')
while read -r line; do
  [ -n "$line" ] && report "fixtures/generate.py: $line"
done <<<"$generator"

outdated=$(mise outdated --bump --local --json |
  jq -r 'to_entries[] | "mise.toml: \(.key) \(.value.requested) -> \(.value.bump)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$outdated"

exit "$stale"
'''

[tasks.upgrade]
description = "Bump every mise tool in this file, every direct NuGet package, and every fixture generator package to its latest, rewriting mise.toml, the csproj files, the lock files in locked form, generate.py, and its lock"
dir = "{{config_root}}"
run = '''
set -euo pipefail
config=$(realpath mise.toml)
tools=$(mise outdated --bump --no-global --json |
  jq -r --arg config "$config" 'to_entries[] | select(.value.source.path == $config and .value.bump != null) |
    "\(.key)@\(.value.bump)"')
for tool in $tools; do
  mise use --path mise.toml "$tool"
done
mise run upgrade:packages
'''

[tasks."upgrade:packages"]
description = "Bump every direct NuGet package and fixture generator package to its latest, rewriting the lock files in locked form; upgrade runs it after the mise tools"
hide = true
dir = "{{config_root}}"
run = '''
set -euo pipefail
export PATH="$DOTNET_ROOT:$PATH"
dotnet restore DocprocOoxml.slnx --force-evaluate >/dev/null
packages=$(dotnet list DocprocOoxml.slnx package --outdated --format json |
  jq -r '.projects[] | .path as $p | .frameworks[]?.topLevelPackages[]? | "\($p) \(.id) \(.latestVersion)"')
while read -r project id version; do
  [ -n "$project" ] && dotnet package add "$id" --project "$project" --version "$version" --no-restore
done <<<"$packages"
dotnet restore DocprocOoxml.slnx --force-evaluate >/dev/null
dotnet restore DocprocOoxml.slnx --locked-mode >/dev/null

generator=$(uv tree -q --script fixtures/generate.py --outdated --depth 0 --locked |
  sed -n 's/^\([^ ]*\) v\([^ ]*\) (latest: v\([^)]*\))$/\1 \2 \3/p')
while read -r name pinned latest; do
  [ -n "$name" ] && sed -i "1,/^# \/\/\/\$/s/\"$name==$pinned\"/\"$name==$latest\"/" fixtures/generate.py
done <<<"$generator"
uv lock -q --script fixtures/generate.py
uv lock -q --script fixtures/generate.py --check
'''

[tasks.fixtures]
description = "Regenerate the generated fixtures and their ground truth; needs LibreOffice's soffice; the check never runs it"
dir = "{{config_root}}"
run = "uv run --script fixtures/generate.py"

[tasks.golden]
description = "Publish the CLI with NativeAOT and re-record each fixture's .jsonl and .stderr golden, and a refused fixture's .exit, from it; the check never runs it; writes only bin/, obj/, .state/, and the goldens"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "golden: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet restore DocprocOoxml.slnx --locked-mode
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror -o .state/aot
golden=test/Docproc.Ooxml.Tests/Expected
rm -rf "$golden"
for fixture in fixtures/generated/*/* fixtures/realworld/*/*; do
  case "$fixture" in
    *.docx | *.xlsx | *.pptx | *.doc) ;;
    *) continue ;;
  esac
  stem="$golden/${fixture#fixtures/}"
  stem="${stem%.*}"
  mkdir -p "$(dirname "$stem")"
  status=0
  .state/aot/docproc-ooxml "$fixture" >"$stem.jsonl" 2>"$stem.stderr" || status=$?
  if [ "$status" -ne 0 ]; then
    echo "$status" >"$stem.exit"
    echo "golden: $fixture exited $status"
  fi
done
echo "golden: $(find "$golden" -name '*.jsonl' | wc -l) fixtures recorded"
'''
