# mise: docproc-ooxml's toolchain and its check, publish, currency, fixtures, and golden tasks. The
# toolchain is pinned here alone; docproc's root check and currency run this file's tasks through
# its TOOLS list (`mise -C tools/ooxml run check`), and tools/pack.sh runs `publish`. Each task
# runs in this directory.
[tools]
dotnet = "11.0.100"
jq = "1.8.2"
uv = "0.13.8"

# A task's shell keeps the caller's PATH order, so where a host `dotnet` without the pinned SDK
# (/usr/bin/dotnet) comes before mise's installs, a bare `dotnet` would run it. Each task that runs
# dotnet first puts the pinned SDK's directory, mise's DOTNET_ROOT, ahead of the rest of PATH.
[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
# The newest glibc symbol version the published binary may require: NativeAOT links libc and libm
# dynamically. tools/pack.sh refuses to pack a binary that requires a newer one.
GLIBC_FLOOR = "2.34"

[tasks.check]
description = "Restore the locked package graph, format, build, publish the CLI with NativeAOT, and test, the CLI tests on the published binary, all warnings as errors; writes only bin/, obj/, and .state/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "check: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
# Every later step uses this restore: a package graph that differs from the committed lock files
# fails here.
dotnet restore DocprocOoxml.slnx --locked-mode
dotnet format DocprocOoxml.slnx --verify-no-changes --no-restore
dotnet build DocprocOoxml.slnx --no-restore -warnaserror
# The tests run the CLI's process contract on this binary, so it is published first.
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror -o .state/aot
dotnet test --solution DocprocOoxml.slnx --no-build
.state/aot/docproc-ooxml --version
'''

# tools/pack.sh runs it to build the release binary it packs; the release workflow runs that on each
# runner, natively.
[tasks.publish]
description = "Publish the release binary for this machine's runtime identifier from the locked package graph, its version the csproj's alone; writes only bin/, obj/, and .state/publish/"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "publish: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet restore DocprocOoxml.slnx --locked-mode
# Without the commit suffix the check's builds carry (0.1.0+<sha>), --version prints exactly the
# version the csproj records, which pack.sh compares with the tag's.
rm -rf .state/publish
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror \
  -p:IncludeSourceRevisionInInformationalVersion=false -o .state/publish
'''

# Read-only and development-time: it reads the network, so CI never runs it. NuGet's audit runs
# here, never in a build, so a newly published advisory is reported without failing the check.
[tasks.currency]
description = "Report every NuGet package behind its latest or with a known vulnerability, and every mise tool behind its latest; writes only obj/"
dir = "{{config_root}}"
run = '''
set -euo pipefail
export PATH="$DOTNET_ROOT:$PATH"
stale=0
report() {
  echo "tools/ooxml: $1"
  stale=1
}
dotnet restore DocprocOoxml.slnx --locked-mode >/dev/null

# Direct NuGet packages with a newer release.
packages=$(dotnet list DocprocOoxml.slnx package --outdated --format json |
  jq -r '.projects[] | .path as $p | .frameworks[]?.topLevelPackages[]? |
    "\($p | split("/") | last): \(.id) \(.requestedVersion) -> \(.latestVersion)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$packages"

# NuGet packages, direct and transitive, with a published advisory.
vulnerable=$(dotnet list DocprocOoxml.slnx package --vulnerable --include-transitive --format json |
  jq -r '.projects[] | .path as $p | .frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) |
    select(.vulnerabilities) | .id as $id | .resolvedVersion as $v | .vulnerabilities[] |
    "\($p | split("/") | last): \($id) \($v) vulnerable (\(.severity)): \(.advisoryurl)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$vulnerable"

# mise tools, the .NET SDK among them, pinned below their latest version.
outdated=$(mise outdated --bump --local --json |
  jq -r 'to_entries[] | "mise.toml: \(.key) \(.value.requested) -> \(.value.bump)"')
while read -r line; do
  [ -n "$line" ] && report "$line"
done <<<"$outdated"

exit "$stale"
'''

[tasks.fixtures]
description = "Regenerate the generated fixtures and their ground truth; needs LibreOffice's soffice; the check never runs it"
dir = "{{config_root}}"
run = "uv run --script fixtures/generate.py"

# The goldens are the published binary's own output, so a change to it is reviewed as a diff of
# them; the check compares against them and never writes them.
[tasks.golden]
description = "Publish the CLI with NativeAOT and re-record each fixture's .jsonl and .stderr golden from it; the check never runs it; writes only bin/, obj/, .state/, and the goldens"
dir = "{{config_root}}"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "golden: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet restore DocprocOoxml.slnx --locked-mode
dotnet publish src/Docproc.Ooxml --no-restore -c Release -r "$rid" -warnaserror -o .state/aot
# Each fixture's goldens sit at its path under fixtures/, less its extension, so a removed
# fixture's goldens go with the directory.
golden=test/Docproc.Ooxml.Tests/Expected
rm -rf "$golden"
for fixture in fixtures/generated/*/* fixtures/realworld/*/*; do
  case "$fixture" in
    *.docx | *.xlsx | *.pptx) ;;
    *) continue ;;
  esac
  stem="$golden/${fixture#fixtures/}"
  stem="${stem%.*}"
  mkdir -p "$(dirname "$stem")"
  # A fixture that exits other than 0 is recorded too, and reported; the tests say which
  # outcome each fixture has.
  status=0
  .state/aot/docproc-ooxml "$fixture" >"$stem.jsonl" 2>"$stem.stderr" || status=$?
  if [ "$status" -ne 0 ]; then
    echo "golden: $fixture exited $status"
  fi
done
echo "golden: $(find "$golden" -name '*.jsonl' | wc -l) fixtures recorded"
'''
