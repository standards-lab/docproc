# docproc-mail's fixture generator's toolchain, loaded only with MISE_ENV=fixtures.
# See docs/tool-builds.md
[tools]
dotnet = "11.0.100"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.fixtures]
description = "Regenerate the generated .pst and .msg fixtures and their manifest from the .eml and item sources, reporting any drift from the committed ones; the check never runs it"
dir = "{{config_root}}/generator"
run = '''
set -eu
export PATH="$DOTNET_ROOT:$PATH"
dotnet run -c Release -- fixtures ../tests/fixtures/generated
'''
