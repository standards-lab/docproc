# The generated fixtures' tools, loaded only with MISE_ENV=fixtures, so neither the check nor CI
# installs .NET: `MISE_ENV=fixtures mise run fixtures` regenerates tests/fixtures/generated/ from
# its .eml and item sources. The check never runs it; it reads the committed outputs.
[tools]
dotnet = "10.0.402"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.fixtures]
description = "Regenerate the generated .pst and .msg fixtures and their manifest from the .eml and item sources, reporting any drift from the committed ones; the check never runs it"
# From generator/, so its global.json pins the SDK.
dir = "{{config_root}}/generator"
run = "dotnet run -c Release -- fixtures ../tests/fixtures/generated"

[tasks.scale]
description = "Build the scale store, about 50k messages and 2 GB, from a seed into .state/scale/ (scale.pst, scale.mboxrd of the same messages, and scale.json), never committed; `-- --seed <n> --messages <n>` override the defaults, 16 and 50000"
dir = "{{config_root}}/generator"
run = "dotnet run -c Release -- scale ../.state/scale"
