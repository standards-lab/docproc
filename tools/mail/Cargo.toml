# See docs/tool-builds.md
[package]
name = "docproc-mail"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "docproc's mail tool: Outlook .pst stores, .msg messages, .eml messages and mbox files to a JSON model"
publish = false

[dependencies]
docproc-envelope = { path = "../envelope" }
# Pinned exactly: the CLI works around known faults of this release, in src/pst.rs.
outlook-pst = "=1.2.0"
codepage = "0.1.3"
encoding_rs = "0.8.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Pinned exactly: the CLI works around its panics on short or oversized input (src/rtf.rs).
compressed-rtf = "=1.0.1"
htmd = "0.6.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
cfb = "0.16.0"
mail-parser = { version = "1.0.1", features = ["full_encoding"] }

[profile.release]
overflow-checks = true

[lints.clippy]
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
