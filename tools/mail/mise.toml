# mise: the toolchain and the check and currency tasks.
[tools]
jq = "1.8.2"
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" }
shellcheck = "0.11.0"

[tasks.check]
description = "Lint, format-check, test, and build the static musl release binary; writes only target/"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
git ls-files -z '*.sh' | xargs -0 -r shellcheck
cargo fmt --check
cargo clippy --all-targets --locked -- -D warnings
cargo test --locked
target="$(uname -m)-unknown-linux-musl"
cargo build --release --locked --target "$target"
"target/$target/release/spike-ai-pipeline-mail" --version
'''

[tasks.mboxrd]
description = "Write the MIME group's mboxrd, tests/fixtures/mime/nine.mboxrd, from its nine .eml; the check rebuilds it and compares it byte for byte"
run = "scripts/mboxrd.sh"

[tasks.currency]
description = "Report every crate, mise tool, and GitHub Action pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.findings]
description = "Score the CLI's fields against the fixtures' truth and time it on plaso's store and the scale store, as a .pst and as an mboxrd; on the laptop, never in CI or the check; writes only .state/findings/ and prints the tables, unless `-- --record [name]` records the run in a new docs/findings/mail-cli/runs/<name>/ (<date>-<n> by default)"
run = "scripts/findings.sh"
