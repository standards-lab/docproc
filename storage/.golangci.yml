# golangci-lint v2 configuration for the storage module, run by `mise run check` from here.
# See docs/development.md
# See architecture/principles/comments.md
version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
      allow-packages: [""]
    depguard:
      rules:
        production:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/standards-lab/docproc/
            - github.com/standards-lab/go-storage$
          deny:
            - pkg: github.com/standards-lab/docproc/postgres
              desc: the storage module requires the base module alone
            - pkg: github.com/standards-lab/docproc/cmd/docproc
              desc: the storage module requires the base module alone
        tests:
          list-mode: strict
          files:
            - $test
          allow:
            - $gostd
            - github.com/standards-lab/docproc/
            - github.com/standards-lab/go-storage$
            - github.com/standards-lab/go-storage/s3$
            - github.com/standards-lab/go-storage/storagetest$
          deny:
            - pkg: github.com/standards-lab/docproc/postgres
              desc: the storage module requires the base module alone
            - pkg: github.com/standards-lab/docproc/cmd/docproc
              desc: the storage module requires the base module alone
