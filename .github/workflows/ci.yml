# CI runs on every pull request into main, every push to main, and on demand. Each system tool's
# check runs once per runner, natively on x64 and arm64, followed by its third-party notices, but
# only when the tool's directory or the wiring every tool shares changed; the Go job runs the
# root's check:go on both runners only when what the Go modules build or read changed; the lint
# job runs the root's lint, shellcheck and actionlint and the release workflow's tag-routing test,
# only when a script, a workflow, or the root mise.toml changed; the integration job runs the
# provider modules' live tiers against the compose harness, on a push to main when what they build
# or run against changed and on demand, never on a pull request. The `ci` job always runs last and
# is the one check docproc's `main` ruleset requires: it fails when any job it needs failed or was
# cancelled, and passes when they succeeded or were skipped, by their paths or, the integration
# job, by a pull request, so a skipped job never blocks a merge. Actions are pinned by their exact
# release tag, which `mise run currency` compares with each action's latest release. A newer run
# on the same ref cancels the one it supersedes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The root mise.toml's 7zz is the integration tier's, which runs on the developer's machine alone,
# so no job installs it, through mise-action or a task's auto-install.
env:
  MISE_DISABLE_TOOLS: github:ip7z/7zip

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tools: ${{ steps.tools.outputs.changes }}
      go: ${{ steps.go.outputs.go }}
      lint: ${{ steps.lint.outputs.lint }}
      integration: ${{ steps.integration.outputs.integration }}
    steps:
      - uses: actions/checkout@v7.0.1

      # One filter per tool, named as its directory under tools/, so the filters that match are
      # the matrix's tools. Each begins with the wiring every tool shares, anchored on the first:
      # this workflow, the root mise.toml its check loads, and tools/'s scripts and envelope table.
      # A Rust tool's adds the Rust tools' shared files, anchored on the first Rust tool: the shared
      # envelope crate's directory, which each Rust tool's check tests against its own lock, and
      # the standard library's and musl's notices every Rust tool's notices end with. So a change
      # to either runs every Rust tool, and no .NET one.
      - id: tools
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            ooxml:
              - &shared ['.github/workflows/ci.yml', 'mise.toml', 'tools/*.sh', 'tools/envelope/cases.json']
              - 'tools/ooxml/**'
            mail:
              - *shared
              - &envelope ['tools/envelope/**', 'tools/notices-rust.txt']
              - 'tools/mail/**'
            onenote:
              - *shared
              - *envelope
              - 'tools/onenote/**'

      # What the Go modules build or read: their sources, go.mod and go.sum files (the storage,
      # postgres, and cmd/docproc modules', and tools/go.mod, the boundary that keeps the tools out
      # of the base module, among them), any testdata, each module's lint config, the postgres
      # module's SQL and the sqlint.toml check:go lints it under, this workflow, and the root
      # mise.toml check:go runs from; and, in the tools' trees, only what the Go tests read in
      # place: the shared envelope cases and each tool's committed goldens and expected outputs. A
      # change to a tool's code alone doesn't run it.
      - id: go
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '**/testdata/**'
              - '**/.golangci.yml'
              - '**/*.sql'
              - '**/sqlint.toml'
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'tools/envelope/cases.json'
              - 'tools/mail/tests/golden/**'
              - 'tools/onenote/tests/golden/**'
              - 'tools/ooxml/test/**/Expected/**'

      # What the provider modules' live tiers build or run against: the storage and postgres
      # modules' sources, go.mod and go.sum, testdata, and the postgres module's SQL, never their
      # docs; each requires the base module at its released version, not this tree's, so a change
      # to the base alone doesn't run them. Then the compose harness, this workflow, and the root
      # mise.toml that defines the integration tasks and the harness's environment.
      - id: integration
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            integration:
              - 'storage/**/*.go'
              - 'storage/go.mod'
              - 'storage/go.sum'
              - 'storage/**/testdata/**'
              - 'postgres/**/*.go'
              - 'postgres/go.mod'
              - 'postgres/go.sum'
              - 'postgres/**/testdata/**'
              - 'postgres/**/*.sql'
              - 'compose.yml'
              - 'compose/**'
              - '.github/workflows/ci.yml'
              - 'mise.toml'

      - id: lint
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            lint:
              - '.github/workflows/**'
              - '**/*.sh'
              - 'mise.toml'

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The lint needs only the root's shellcheck and actionlint, not its Go toolchain; the
      # routing test needs bash alone.
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: actionlint shellcheck

      - name: mise run lint
        run: mise run lint

  go:
    name: check:go (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      # check:go needs only the root's Go toolchain and golangci-lint.
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: go golangci-lint

      # The modules go.sum pins, as downloaded, and the build cache; both are keyed on go.sum, the
      # build cache being only a speedup the go command checks entry by entry.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: mise run check:go
        run: mise run check:go

  tool:
    name: check (${{ matrix.tool }}, ${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v7.0.1

      # NativeAOT links with clang against zlib, so a .NET tool (a .slnx) alone needs them; a Rust
      # tool's musl targets come with its pinned toolchain.
      - name: Install the NativeAOT prerequisites
        if: hashFiles(format('tools/{0}/*.slnx', matrix.tool)) != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # mise installs from the tool's directory, so the toolchain the tool's mise.toml pins is the
      # one installed; the tool's tasks put it ahead of the runner's own dotnet on PATH.
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: tools/${{ matrix.tool }}

      # A .NET tool's packages its lock files pin, as downloaded; bin/ and obj/ are built fresh.
      - uses: actions/cache@v6.1.0
        if: hashFiles(format('tools/{0}/*.slnx', matrix.tool)) != ''
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('tools/{0}/**/packages.lock.json', matrix.tool)) }}
          restore-keys: nuget-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-

      # A Rust tool's crates its Cargo.lock pins, as downloaded, and any git sources; target/ is
      # built fresh.
      - uses: actions/cache@v6.1.0
        if: hashFiles(format('tools/{0}/Cargo.lock', matrix.tool)) != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('tools/{0}/Cargo.lock', matrix.tool)) }}
          restore-keys: cargo-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-

      - name: mise run check
        working-directory: tools/${{ matrix.tool }}
        run: mise run check

      # The notices a release would pack for this runner, so a package the script can't give a
      # notice for fails here, not at the tag.
      - name: Third-party notices
        working-directory: tools/${{ matrix.tool }}
        run: |
          case "$(uname -m)" in
            x86_64) rid=linux-x64 ;;
            aarch64) rid=linux-arm64 ;;
            *) echo "ci: no runtime identifier for $(uname -m)"; exit 1 ;;
          esac
          mise exec -- ../notices.sh "$TOOL" "$rid" >/dev/null

  # The provider modules' live tiers, each against its compose service, the same tasks a developer
  # runs; never the base module's tools tier, nor cmd/docproc's built-binary tier, which runs the
  # same tools: both are test:integration's, on the developer's machine. On a push to main whose
  # paths need it, and always on demand, where the paths filter has no push to compare; skipped on
  # a pull request, below the per-PR rate by design. Each task starts its service, prints its log on
  # a failure, and stops it.
  integration:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.integration == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The tasks need only the root's Go toolchain; docker is the runner's.
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: go

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: mise run integration
        run: mise run integration

  ci:
    if: always()
    needs: [changes, lint, go, tool, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "ci: needed jobs' results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "ci: a needed job's result is $result"; exit 1 ;;
            esac
          done
