# Release: a system tool's or a Go module's GitHub release, from its pushed tag.
# See docs/ci.md
name: Release

on:
  push:
    tags:
      - 'v*'
      - '**/v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: github:ip7z/7zip

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      format: ${{ steps.tag.outputs.format }}
      changelog: ${{ steps.tag.outputs.changelog }}
      prefix: ${{ steps.tag.outputs.prefix }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Route the tag to a system tool or a Go module
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-tag.sh "$TAG" >>"$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.kind == 'tool'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      FORMAT: ${{ needs.tag.outputs.format }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the NativeAOT prerequisites
        if: hashFiles(format('tools/{0}/*.slnx', needs.tag.outputs.format)) != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - uses: jdx/mise-action@v5.3.0
        with:
          working_directory: tools/${{ needs.tag.outputs.format }}

      - name: Build, check the version against the tag and the glibc floor, and pack
        run: tools/pack.sh "$FORMAT" "$VERSION"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: tools/${{ needs.tag.outputs.format }}/.state/pack/docproc-${{ needs.tag.outputs.format }}-v${{ needs.tag.outputs.version }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: [tag, build]
    if: needs.tag.outputs.kind == 'tool'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.tar.gz >SHA256SUMS

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: tools/${{ needs.tag.outputs.format }}/CHANGELOG.md
          prefix: tools/${{ needs.tag.outputs.format }}/
          draft: true

      - name: Attach the archives and SHA256SUMS
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  module:
    needs: tag
    if: needs.tag.outputs.kind == 'module'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: ${{ needs.tag.outputs.changelog }}
          prefix: ${{ needs.tag.outputs.prefix }}
