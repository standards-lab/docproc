# golangci-lint v2 configuration for the postgres module, run by `mise run check` from here.
# See docs/development.md
# See architecture/principles/comments.md
version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
      allow-packages: [""]
    depguard:
      rules:
        production:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/standards-lab/docproc/
            - github.com/standards-lab/sqlate$
            - github.com/standards-lab/sqlate/
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/
          deny:
            - pkg: github.com/standards-lab/docproc/storage
              desc: the postgres module requires the base module alone
            - pkg: github.com/standards-lab/docproc/cmd/docproc
              desc: the postgres module requires the base module alone
            - pkg: github.com/standards-lab/sqlate/postgres/pgtest
              desc: pgtest imports testing; only the module's tests use it
        tests:
          list-mode: strict
          files:
            - $test
          allow:
            - $gostd
            - github.com/standards-lab/docproc/
            - github.com/standards-lab/sqlate$
            - github.com/standards-lab/sqlate/
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/
          deny:
            - pkg: github.com/standards-lab/docproc/storage
              desc: the postgres module requires the base module alone
            - pkg: github.com/standards-lab/docproc/cmd/docproc
              desc: the postgres module requires the base module alone
